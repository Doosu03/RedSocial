<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Red Social</title>

    <!-- Archivo CSS dentro de la carpeta css -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

        <header class="encabezado">
            <h1>Red Social</h1>

            <p>
                Comparte un mensaje con tus compañeros.
            </p>

        </header>

            <form id="formulario-publicacion" novalidate>

                <div class="campo">

                    <label for="nombre">
                        Nombre del estudiante
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre"
                        maxlength="50"
                        autocomplete="off"
                    >

                    <small
                        id="error-nombre"
                        class="mensaje-error"
                    ></small>

                </div>

                <div class="campo">

                    <label for="mensaje">
                        Mensaje
                    </label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        placeholder="¿Qué deseas compartir?"
                        rows="4"
                        maxlength="250"
                    ></textarea>

                    <div class="detalle-mensaje">

                        <small
                            id="error-mensaje"
                            class="mensaje-error"
                        ></small>

                        <small id="contador-caracteres">
                            0/250
                        </small>

                    </div>

                </div>

                <button
                    type="submit"
                    class="boton-publicar"
                >
                    Publicar
                </button>

            </form>

        </section>

        <section class="seccion-publicaciones">

            <h2>Publicaciones</h2>

            <div
                class="resumen-actividad"
                aria-label="Resumen de actividad"
            >
                <div class="dato-resumen">
                    <strong id="total-publicaciones">0</strong>
                    <span>Publicaciones</span>
                </div>

                <div class="dato-resumen">
                    <strong id="total-me-gusta">0</strong>
                    <span>Me gusta</span>
                </div>

                <div class="dato-resumen">
                    <strong id="total-comentarios">0</strong>
                    <span>Comentarios</span>
                </div>
            </div>

            <div class="control-orden">
                <label for="orden-publicaciones">
                    Ordenar por
                </label>

                <select id="orden-publicaciones" name="orden-publicaciones">
                    <option value="recientes">Recientes</option>
                    <option value="antiguas">Antiguas</option>
                    <option value="mas-gustadas">Más gustadas</option>
                </select>
            </div>

            <form
                id="formulario-busqueda"
                class="formulario-busqueda"
                role="search"
                novalidate
            >

                <label for="buscador">
                    Buscar publicaciones
                </label>

                <div class="campo-busqueda">

                    <input
                        type="search"
                        id="buscador"
                        name="buscador"
                        placeholder="Buscar por autor o contenido"
                        maxlength="50"
                        autocomplete="off"
                    >

                    <button
                        type="submit"
                        class="boton-buscar"
                    >
                        Buscar
                    </button>

                    <button
                        type="button"
                        id="limpiar-busqueda"
                        class="boton-limpiar"
                    >
                        Limpiar
                    </button>

                </div>

                <small
                    id="resumen-busqueda"
                    class="resumen-busqueda"
                    aria-live="polite"
                ></small>

            </form>

            <p
                id="mensaje-vacio"
                class="mensaje-vacio"
                aria-live="polite"
            >
                Todavía no hay publicaciones.
            </p>

            <div
                id="lista-publicaciones"
                class="lista-publicaciones"
            ></div>

        </section>

    </main>

    <!-- Archivo JavaScript dentro de la carpeta js -->
    <script src="js/app.js"></script>

</body>
</html>
